name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A second deploy starting while the first is mid-upload would interleave two
# sets of files over FTP and leave the document root in a mixed state.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # `next build` writes the static export to out/. If this step fails the
      # deploy never runs, which is the behaviour that was missing before: a
      # syntax error in the catalog used to fail the build and the workflow
      # would still be marked as having run.
      - name: Build static export
        run: npm run build

      # A successful build that produced no pages is still a broken deploy.
      - name: Verify export
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
          test -f out/404.html || { echo "::error::out/404.html missing"; exit 1; }
          test -f out/.htaccess || { echo "::error::out/.htaccess missing"; exit 1; }
          test -f out/sitemap.xml || { echo "::error::out/sitemap.xml missing"; exit 1; }
          pages=$(find out -name 'index.html' | wc -l)
          echo "exported $pages pages"
          [ "$pages" -ge 50 ] || { echo "::error::only $pages pages exported, expected 50+"; exit 1; }

      - name: Deploy to GoDaddy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: out/
          server-dir: /
          # dangerous-clean-slate is deliberately not used: it wipes the
          # document root before uploading, which takes the site offline for
          # the length of the transfer.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
