name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A second deploy starting while the first is mid-upload would interleave two
# sets of files over FTP and leave the document root in a mixed state.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # `next build` writes the static export to out/. If this step fails the
      # deploy never runs, which is the behaviour that was missing before: a
      # syntax error in the catalog used to fail the build and the workflow
      # would still be marked as having run.
      #
      # Commerce is on at build time so the cart ships and is live for every
      # visitor. There is no second client-side gate any more: Razorpay is
      # connected, so the checkout this links to is one that can take money.
      #
      # Reviews are on because there are real ones to show. Both review flags
      # move together on purpose -- `REVIEWS_ENABLED` renders the section,
      # `REVIEWS_ARE_REAL` lets it emit aggregateRating into structured data,
      # and the second must never be true of placeholder content, because a
      # fabricated star rating in Google's index is a search-policy breach
      # rather than an ordinary design compromise.
      #
      # The reviews themselves are baked in from src/data/reviews.generated.json,
      # which is committed. A review written after the last `npm run reviews:fetch`
      # will not appear until someone re-runs it and commits the result.
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_COMMERCE_ENABLED: "true"
          NEXT_PUBLIC_REVIEWS_ENABLED: "true"
          NEXT_PUBLIC_REVIEWS_ARE_REAL: "true"

      # A successful build can still produce a broken site: dropped social
      # cards, duplicate canonicals, redirects pointing at pages that no
      # longer exist. The verifier inspects out/ and fails the deploy.
      - name: Verify export
        run: npm run verify

      # A deploy deletes the chunk filenames it no longer references, which
      # breaks visitors still holding a cached navigation payload that asks
      # for them: they get a 404 and a page that will only come back with a
      # reload. Cloudflare hides this for a while by answering from its own
      # year-long cache, so it surfaces as an intermittent fault that cannot
      # be reproduced on a clean browser.
      #
      # Restoring the previous window and carrying those files back into out/
      # means the deploy leaves them in place. A miss is harmless: the step
      # simply starts a new window.
      - name: Restore recent build assets
        uses: actions/cache/restore@v4
        with:
          path: .asset-history
          key: asset-history-${{ github.run_id }}
          restore-keys: asset-history-

      # After verify on purpose, so the verifier only ever inspects what this
      # build produced rather than files carried over from earlier ones.
      - name: Carry recent build assets forward
        run: npm run retain-assets

      - name: Save recent build assets
        uses: actions/cache/save@v4
        with:
          path: .asset-history
          key: asset-history-${{ github.run_id }}

      - name: Deploy to GoDaddy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: out/
          server-dir: /
          # dangerous-clean-slate is deliberately not used: it wipes the
          # document root before uploading, which takes the site offline for
          # the length of the transfer.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
